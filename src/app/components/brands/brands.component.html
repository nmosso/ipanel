<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1>Brands</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active">Brands</li>
        </ol>
      </div>
    </div>
  </div>
</section>

<!-- Main content -->
<div class="component-container">

  <!-- Tabla de marcas -->
  <div class="card shadow-sm" *ngIf="!editPopup">
    <div class="card-header d-flex align-items-center justify-content-between">
      <h5 class="mb-0">
        <i class="fas fa-tag mr-2"></i> Device Brands
      </h5>
      <button id="btn-new-brand" class="btn btn-primary btn-sm" (click)="openNew()">
        <i class="fas fa-plus mr-1"></i> Nueva Marca
      </button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0">
          <thead class="thead-light">
            <tr>
              <th>Marca</th>
              <th>Descripción</th>
              <th class="text-center" style="width:140px;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of brands; trackBy: trackByBrand">
              <td>
                <span class="badge badge-secondary px-2 py-1" style="font-size:.85rem;">
                  <i class="fas fa-tag mr-1"></i>{{ item.brand }}
                </span>
              </td>
              <td>{{ item.description || '—' }}</td>
              <td class="text-center">
                <button
                  id="btn-edit-brand-{{ item.brand }}"
                  class="btn btn-sm btn-outline-primary mr-1"
                  title="Editar"
                  (click)="openEdit(item)">
                  <i class="fas fa-edit"></i>
                </button>
                <button
                  id="btn-delete-brand-{{ item.brand }}"
                  class="btn btn-sm btn-outline-danger"
                  title="Eliminar"
                  (click)="delete(item)">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="brands.length === 0">
              <td colspan="3" class="text-center text-muted py-4">
                <i class="fas fa-info-circle mr-1"></i> No hay marcas registradas
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Formulario de alta / edición -->
  <div class="card shadow-sm" *ngIf="editPopup">
    <div class="card-header d-flex align-items-center">
      <h5 class="mb-0">
        <i class="fas fa-{{ isEditMode ? 'edit' : 'plus' }} mr-2"></i>
        {{ isEditMode ? 'Editar Marca' : 'Nueva Marca' }}
      </h5>
    </div>
    <div class="card-body">

      <!-- Error del backend -->
      <div class="alert alert-danger d-flex align-items-center" *ngIf="serverError" id="brand-server-error">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span>{{ serverError }}</span>
      </div>

      <form [formGroup]="brandForm" novalidate (ngSubmit)="save()">
        <div class="row">
          <!-- Brand -->
          <div class="col-md-6">
            <div class="form-group">
              <label for="brand-input">Marca <span class="text-danger">*</span></label>
              <input
                id="brand-input"
                type="text"
                class="form-control"
                formControlName="brand"
                placeholder="Ej: Samsung, LG, Xiaomi..."
                [ngClass]="{ 'is-invalid': f['brand'].invalid && f['brand'].touched }"
                [readonly]="isEditMode"
              />
              <div class="invalid-feedback" *ngIf="f['brand'].errors?.['required']">La marca es requerida.</div>
              <div class="invalid-feedback" *ngIf="f['brand'].errors?.['minlength']">Mínimo 2 caracteres.</div>
            </div>
          </div>

          <!-- Description -->
          <div class="col-md-6">
            <div class="form-group">
              <label for="brand-description">Descripción</label>
              <input
                id="brand-description"
                type="text"
                class="form-control"
                formControlName="description"
                placeholder="Descripción opcional"
              />
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="row mt-3">
          <div class="col-md-12 d-flex justify-content-end">
            <button
              id="btn-cancel-brand"
              type="button"
              class="btn btn-secondary mr-2"
              (click)="closeForm()"
              [disabled]="formSubmissionFlag">
              <i class="fas fa-times mr-1"></i> Cancelar
            </button>
            <button
              id="btn-save-brand"
              type="submit"
              class="btn btn-primary"
              [disabled]="formSubmissionFlag">
              <span *ngIf="formSubmissionFlag" class="spinner-border spinner-border-sm mr-1" role="status"></span>
              <i *ngIf="!formSubmissionFlag" class="fas fa-save mr-1"></i>
              {{ isEditMode ? 'Actualizar' : 'Guardar' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>
